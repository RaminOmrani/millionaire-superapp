# /etc/nginx/sites-available/app.softmiliac.com  →  ln -s into sites-enabled, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d app.softmiliac.com      (if certbot is how the other sites get TLS)
server {
    listen 80;
    listen [::]:80;
    server_name app.softmiliac.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location ~ ^/(fonts|brand|_next/static)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
